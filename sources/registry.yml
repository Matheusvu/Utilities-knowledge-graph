# Data source registry — canonical catalog feeding the pipeline (see PLAN.md §4.1).
# Validated by: python pipeline/checks/validate_registry.py
#
# Phase 1.1 scope: CURTAILMENT-FIRST — the physical-truth layer (ONS constrained-off
# + denominators/context), the asset master (ANEEL SIGA), and ONS methodology docs.
# Phase 1.2 will add the rule layer (ANEEL compensation), settlement layer (CCEE),
# litigation overlay (STJ/DOU), and the remaining sector-wide sources.
#
# Source of truth for these entries: research/reports/2026-06-17_brazil_power_source_inventory.md
# NOTE: `data_url` (the actual resource file) is intentionally omitted for CKAN datasets —
# fetchers resolve the current resource via the CKAN API (api/3/action/) from `url`.

